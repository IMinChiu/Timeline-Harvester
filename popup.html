<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 250px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        .header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1877f2;
        }
        .status {
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
            padding: 8px;
            background: #f0f2f5;
            border-radius: 4px;
        }
        .status.active {
            background: #e7f3ff;
            color: #1877f2;
        }
        .status.stopped {
            background: #fff4e6;
            color: #d97706;
        }
        button {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start {
            background: #1877f2;
            color: white;
        }
        .btn-start:hover {
            background: #166fe5;
        }
        .btn-stop {
            background: #e41e3f;
            color: white;
        }
        .btn-stop:hover {
            background: #c91e3f;
        }
        .btn-start:disabled,
        .btn-stop:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .info {
            font-size: 11px;
            color: #999;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">FB Timeline Harvester</div>
    <div id="status" class="status stopped">Status: Not Started</div>
    <button id="startBtn" class="btn-start">Start Scraping</button>
    <button id="stopBtn" class="btn-stop" style="display: none; margin-top: 8px;">Stop Scraping</button>
    <div class="info" id="info">Click "Start Scraping" to begin collecting posts</div>
    
    <script src="popup.js"></script>
</body>
</html>
